<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  {% feed_meta %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap nav">
      <a class="brand" href="{{ '/' | relative_url }}">Varshini<span>.</span></a>
      <nav>
        <a href="{{ '/#about' | relative_url }}">About</a>
        <a href="{{ '/#projects' | relative_url }}">Projects</a>
        <a href="{{ '/blog/' | relative_url }}">Blog</a>
        <a href="{{ '/#contact' | relative_url }}">Contact</a>
      </nav>
    </div>
  </header>
  <main>
    {{ content }}
  </main>
  <footer class="site-footer">
    <div class="wrap">
      <p>© {{ site.time | date: '%Y' }} Varshini Gayathri Suresh · Aachen, Germany ·
        <a href="https://www.linkedin.com/in/{{ site.linkedin }}">LinkedIn</a> ·
        <a href="https://github.com/{{ site.github }}">GitHub</a></p>
    </div>
  </footer>
</body>
</html>
